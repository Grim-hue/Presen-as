# Local development, matching docker-compose.yml.
# Port 8280 rather than the 8080 default: another JVM on this machine already
# listens on 8080, and a clash there fails at boot with a bare 404 from the
# other process, which is a confusing thing to debug.
server.port=8280

# Host port 5632, chosen so this can run alongside survey-suite on 5532.
spring.datasource.url=jdbc:postgresql://localhost:5632/presenceDB?currentSchema=dev
spring.datasource.username=dbuser
spring.datasource.password=potatoes

# Fail on boot if the database is unreachable, rather than on the first request.
spring.datasource.hikari.initialization-fail-timeout=10000

# Development runs over plain http, so the cookie cannot carry the Secure flag or the
# browser would refuse to send it back. Every deployed profile must set this to true.
auth.cookie.secure=false
