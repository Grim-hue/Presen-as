spring.application.name=pse_presence
server.port=${PORT:8080}
spring.profiles.default=local

# Driver only. Each profile supplies its own url, username and password.
spring.datasource.driver-class-name=org.postgresql.Driver

# The application is a JSON API plus a static SPA. It has no server-rendered views,
# so an unmatched path must be a 404 the advice can shape, not a Whitelabel page.
spring.web.resources.add-mappings=true

# Authentication. The provider is swappable: `local` checks the BCrypt hash in the
# database, and an `ldap` provider will bind to Active Directory without the login
# flow changing.
auth.provider=local
auth.cookie.name=authToken
auth.cookie.same-site=Strict
auth.token.idle-ttl=24h
auth.token.max-per-user=3

# Vacation spreadsheet import. The column headings live here rather than in code
# because the file is produced elsewhere and its wording is not ours to fix.
# Matching ignores case and accents, so "Início" also matches "inicio".
absence.import.name-headers=nome,colaborador,elemento,funcionario
absence.import.start-headers=inicio,data inicio,data de inicio,de
absence.import.end-headers=fim,data fim,data de fim,ate,a
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
